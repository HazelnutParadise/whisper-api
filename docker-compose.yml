services:
  whisper-api:
    build: .
    container_name: whisper-api
    environment:
      WHISPERX_HF_TOKEN: ${WHISPERX_HF_TOKEN}
      HF_HOME: /app/models/hf-cache
      HUGGINGFACE_HUB_CACHE: /app/models/hf-cache/hub
      TRANSFORMERS_CACHE: /app/models/hf-cache/transformers
    deploy:
      resources:
        reservations:
          devices:
            - capabilities:
                - gpu
              count: all
              driver: nvidia
    ports:
      - "5148:5000"
    volumes:
      - /mnt/ssd1/whisper/models:/app/models
    networks:
      - infra-net
    restart: unless-stopped

networks:
  infra-net:
    external: true
