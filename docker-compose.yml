services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: whisper-gateway
    environment:
      ASR_BASE_URL: http://asr:5000
      TTS_BASE_URL: http://higgs-tts:8000
    ports:
      - "5148:5000"
    depends_on:
      asr:
        condition: service_started
      higgs-tts:
        condition: service_healthy
    networks:
      - speech-net
    restart: unless-stopped

  asr:
    build:
      context: .
      dockerfile: whisper_service/Dockerfile
    container_name: whisper-asr
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-1}
      HF_HOME: /app/models/hf-cache
      HUGGINGFACE_HUB_CACHE: /app/models/hf-cache/hub
      TRANSFORMERS_CACHE: /app/models/hf-cache/transformers
      WHISPERX_DEVICE: ${WHISPERX_DEVICE:-cuda}
      WHISPERX_COMPUTE_TYPE: ${WHISPERX_COMPUTE_TYPE:-float16}
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
    gpus: all
    volumes:
      - ${ASR_MODELS_PATH:-/mnt/ssd1/whisper/models}:/app/models
    networks:
      - speech-net
    restart: unless-stopped

  higgs-tts:
    build:
      context: .
      dockerfile: tts_service/Dockerfile
    container_name: whisper-higgs-tts
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-1}
      HIGGS_AUDIO_MODEL: ${HIGGS_AUDIO_MODEL:-eustlb/higgs-audio-v2-generation-3B-base}
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
    gpus: all
    volumes:
      - ${HIGGS_CACHE_PATH:-/mnt/ssd1/whisper/higgs-cache}:/root/.cache/huggingface
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 5m
    networks:
      - speech-net
    restart: unless-stopped

networks:
  speech-net:
    external: true
    name: infra-net
