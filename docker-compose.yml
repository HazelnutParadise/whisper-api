services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: whisper-gateway
    environment:
      ASR_BASE_URL: http://asr:5000
      TTS_BASE_URL: http://coqui-tts:8000
    ports:
      - "5148:5000"
    depends_on:
      asr:
        condition: service_started
      coqui-tts:
        condition: service_healthy
    networks:
      - speech-net
    restart: unless-stopped

  asr:
    build:
      context: .
      dockerfile: whisper_service/Dockerfile
    container_name: whisper-asr
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /app/models/hf-cache
      HUGGINGFACE_HUB_CACHE: /app/models/hf-cache/hub
      TRANSFORMERS_CACHE: /app/models/hf-cache/transformers
      HF_HUB_DISABLE_XET: "1"
    gpus: all
    volumes:
      - /mnt/ssd1/whisper/models:/app/models
    networks:
      - speech-net
    restart: unless-stopped

  coqui-tts:
    build:
      context: .
      dockerfile: tts_service/Dockerfile
    container_name: whisper-coqui-tts
    environment:
      TTS_HOME: /root/.local/share/tts
      HF_HOME: /root/.local/share/tts/hf-cache
      HUGGINGFACE_HUB_CACHE: /root/.local/share/tts/hf-cache/hub
      TRANSFORMERS_CACHE: /root/.local/share/tts/hf-cache/transformers
      COQUI_TOS_AGREED: "1"
    gpus: all
    volumes:
      - /mnt/ssd1/whisper/coqui-cache:/root/.local/share/tts
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 5m
    networks:
      - speech-net
    restart: unless-stopped

networks:
  speech-net:
    external: true
    name: infra-net
